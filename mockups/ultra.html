<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#0a0a0a;color:#fff;
    display:flex;flex-direction:column;
  }

  /* Hero banner */
  .hero{
    position:relative;height:280px;overflow:hidden;flex-shrink:0;
  }
  .hero-img{
    width:100%;height:100%;object-fit:cover;
    filter:brightness(.75) contrast(1.1);
  }
  .hero-gradient{
    position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 20%,rgba(10,10,10,.4) 60%,#0a0a0a 100%);
  }

  /* Profile cluster */
  .profile{
    position:relative;z-index:2;
    margin-top:-64px;padding:0 28px;
    display:flex;align-items:flex-end;gap:18px;
  }
  .avatar{
    width:108px;height:108px;border-radius:24px;
    border:3px solid #0a0a0a;
    object-fit:cover;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
  }
  .profile-text{margin-bottom:8px}
  .profile-text h1{
    font-family:'Playfair Display',serif;
    font-size:26px;font-weight:700;line-height:1.15;
    letter-spacing:-0.01em;
  }
  .profile-text .title{
    font-size:13px;color:rgba(255,255,255,.55);
    font-weight:400;margin-top:3px;letter-spacing:.02em;
  }

  /* Verified badge */
  .verified{
    display:inline-flex;align-items:center;gap:5px;
    margin-top:6px;font-size:11px;font-weight:500;
    color:rgba(168,139,93,1);letter-spacing:.04em;
  }
  .verified svg{width:14px;height:14px}

  /* Quick stats row */
  .stats{
    display:flex;gap:0;padding:20px 28px 0;
  }
  .stat{
    flex:1;text-align:center;
    border-right:1px solid rgba(255,255,255,.08);
    padding:8px 0;
  }
  .stat:last-child{border-right:none}
  .stat-val{font-size:20px;font-weight:600;letter-spacing:-0.02em}
  .stat-label{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

  /* Actions grid */
  .actions{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    padding:20px 28px 0;
  }
  .action{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    color:#fff;text-decoration:none;
    font-size:13px;font-weight:500;
    transition:background .2s,border-color .2s;
  }
  .action:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
  .action-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .action-icon svg{width:18px;height:18px}
  .action-icon.call{background:rgba(34,197,94,.15);color:#22c55e}
  .action-icon.text{background:rgba(59,130,246,.15);color:#3b82f6}
  .action-icon.email{background:rgba(168,139,93,.15);color:#a88b5d}
  .action-icon.book{background:rgba(168,85,247,.15);color:#a855f7}
  .action span{display:flex;flex-direction:column;gap:1px}
  .action .sub{font-size:10px;color:rgba(255,255,255,.35);font-weight:400}

  /* Full-width primary CTA */
  .cta-main{
    margin:16px 28px 0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:15px;
    background:linear-gradient(135deg,#a88b5d,#d4b878);
    border-radius:14px;
    color:#0a0a0a;text-decoration:none;
    font-size:14px;font-weight:600;letter-spacing:.02em;
    box-shadow:0 4px 20px rgba(168,139,93,.3);
  }
  .cta-main svg{width:16px;height:16px}

  /* Social row */
  .socials{
    display:flex;justify-content:center;gap:16px;
    padding:20px 28px 0;
  }
  .soc{
    width:40px;height:40px;border-radius:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.5);text-decoration:none;
    transition:background .2s,color .2s;
  }
  .soc:hover{background:rgba(255,255,255,.12);color:#fff}
  .soc svg{width:18px;height:18px}

  /* Footer tagline */
  .tagline{
    margin-top:auto;
    padding:16px 28px 20px;text-align:center;
    font-family:'Playfair Display',serif;
    font-size:13px;font-style:italic;
    color:rgba(255,255,255,.25);
    letter-spacing:.01em;
  }
</style>
</head>
<body>

<!-- Hero banner — using a free Pexels photo of a luxury interior -->
<div class="hero">

  <div class="hero-gradient"></div>
</div>

<!-- Profile -->
<div class="profile">

  <a href="#" class="action">

  </a>
  <a href="#" class="action">
    <div class="action-icon book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>

</div>

<!-- Primary CTA -->

</body>
</html>
