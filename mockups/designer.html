<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcus Hale — Interior Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Space Grotesk','Inter',system-ui,sans-serif;
    background:#0c0c0c;color:#e8e4df;
    display:flex;flex-direction:column;
    position:relative;
  }
  /* Geometric background shapes */
  .geo{position:absolute;pointer-events:none;z-index:0}
  .geo-1{top:-20px;right:-30px;width:140px;height:140px;border:1.5px solid rgba(200,180,140,.12);transform:rotate(35deg)}
  .geo-2{bottom:120px;left:-40px;width:100px;height:100px;border:1.5px solid rgba(200,180,140,.08);transform:rotate(15deg);border-radius:4px}
  .geo-3{top:42%;right:10px;width:60px;height:60px;background:rgba(200,180,140,.06);transform:rotate(55deg)}
  .photo{
    height:46%;position:relative;overflow:hidden;
    background:#080808;z-index:1;
  }
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:contrast(1.05) saturate(.9)}
  .photo::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:80px;
    background:linear-gradient(transparent,#0c0c0c);
  }
  .accent-line{position:absolute;bottom:0;left:22px;width:40px;height:3px;background:#c8b48c;z-index:2}
  .body{flex:1;padding:16px 22px 20px;display:flex;flex-direction:column;position:relative;z-index:1}
  .name{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .role{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#c8b48c;margin-top:5px}
  .tagline{font-size:10px;color:rgba(232,228,223,.4);margin-top:10px;line-height:1.5;max-width:24ch}
  .socials{display:flex;gap:10px;margin-top:12px}
  .soc{
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(232,228,223,.4);cursor:pointer;
    border-bottom:1px solid transparent;
    transition:color .2s,border-color .2s;padding-bottom:2px;
  }
  .soc:hover{color:#c8b48c;border-color:#c8b48c}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:0}
  .act{
    font-size:12px;color:#e8e4df;padding:9px 0;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(232,228,223,.08);
    cursor:pointer;transition:color .2s,padding-left .2s;
  }
  .act:hover{color:#c8b48c;padding-left:4px}
  .act:last-child{border-bottom:none}
  .act-arr{color:#c8b48c;font-size:14px;font-weight:300}
</style>
</head>
<body>
  <div class="geo geo-1"></div>
  <div class="geo geo-2"></div>
  <div class="geo geo-3"></div>
  <div class="photo">
    <img src="../images/designer-portrait.jpg" alt="Marcus Hale">
    <div class="accent-line"></div>
  </div>
  <div class="body">
    <div class="name">Marcus Hale</div>
    <div class="role">Interior Design</div>
    <div class="tagline">Residential. Commercial. Considered spaces.</div>
    <div class="socials">
      <span class="soc" title="Behance"><svg width="16" height="10" viewBox="0 0 576 512" fill="currentColor"><path d="M232 237.2c31.8-15.2 48.4-38.2 48.4-74 0-70.6-52.6-87.8-113.3-87.8H0v354.4h171.8c64.4 0 124.9-30.9 124.9-102.9 0-44.5-21.1-77.4-64.7-89.7zM77.9 135.9H151c28.1 0 53.4 7.9 53.4 40.5 0 30.1-19.7 42.2-47.5 42.2h-79V135.9zm83.3 233.7H77.9V272h84.9c34.3 0 56 14.3 56 50.6 0 35.8-25.9 47-57.6 47zm358.5-240.7H376V94h143.7v34.9zM576 305.2c0-75.9-44.4-139.2-124.9-139.2-78.2 0-131.3 58.8-131.3 135.8 0 79.9 50.3 134.7 131.3 134.7 61.3 0 101-27.6 120.1-86.3H509c-6.7 21.9-34.3 33.5-55.7 33.5-41.3 0-63-24.2-63-65.3h185.1c.3-4.2.6-8.7.6-13.2zM390.4 274c2.3-33.7 24.7-54.8 58.5-54.8 35.4 0 53.2 20.8 56.2 54.8H390.4z"/></svg></span>
      <span class="soc" title="LinkedIn"><svg width="13" height="13" viewBox="0 0 448 512" fill="currentColor"><path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 01107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.83-48.3 93.97 0 111.28 61.9 111.28 142.3V448z"/></svg></span>
      <span class="soc" title="Pinterest"><svg width="12" height="14" viewBox="0 0 384 512" fill="currentColor"><path d="M204 6.5C101.4 6.5 0 74.9 0 185.6 0 256 39.6 296 63.6 296c9.9 0 15.6-27.6 15.6-35.4 0-9.3-23.7-29.1-23.7-67.8 0-80.4 61.2-137.4 140.4-137.4 68.1 0 118.5 38.7 118.5 109.8 0 53.1-21.3 152.7-90.3 152.7-24.9 0-46.2-18-46.2-43.8 0-37.8 26.4-74.4 26.4-113.4 0-66.2-93.9-54.2-93.9 25.8 0 16.8 2.1 35.4 9.6 50.7-13.8 59.4-42 147.9-42 209.1 0 18.9 2.7 37.5 4.5 56.4 3.4 3.8 1.7 3.4 6.9 1.5 50.4-69 48.6-82.5 71.4-172.8 12.3 23.4 44.1 36 69.3 36 106.2 0 153.9-103.5 153.9-196.8C384 71.3 298.2 6.5 204 6.5z"/></svg></span>
    </div>
    <div class="actions">
      <div class="act">Call <span class="act-arr">→</span></div>
      <div class="act">Text <span class="act-arr">→</span></div>
      <div class="act">Portfolio <span class="act-arr">→</span></div>
      <div class="act">Save contact <span class="act-arr">→</span></div>
    </div>
  </div>
</body>
</html>
