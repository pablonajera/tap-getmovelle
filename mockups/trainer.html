<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamie Chen — Strength Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#1a1a1a;color:#fff;
    display:flex;flex-direction:column;
    position:relative;
  }
  /* Diagonal lime accent stripe */
  body::after{
    content:'';position:absolute;bottom:200px;left:-20px;width:120%;height:2px;
    background:linear-gradient(90deg,transparent 0%,rgba(200,255,0,.2) 20%,rgba(200,255,0,.08) 80%,transparent 100%);
    transform:rotate(6deg);
    pointer-events:none;z-index:0;
  }
  .photo{
    height:44%;position:relative;overflow:hidden;
    background:#0e0e0e;z-index:1;
  }
  .photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05)}
  .lime-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#c8ff00}
  .body{flex:1;padding:18px 22px 22px;display:flex;flex-direction:column;position:relative;z-index:1}
  .name{font-size:20px;font-weight:700;letter-spacing:-0.01em}
  .role{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#c8ff00;margin-top:4px}
  .stats{display:flex;gap:16px;margin-top:14px;font-size:10px;color:rgba(255,255,255,.5)}
  .stats span b{color:#fff;display:block;font-size:15px;font-weight:600;margin-bottom:2px}
  .socials{display:flex;gap:12px;margin-top:12px}
  .soc{
    font-size:8px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.35);cursor:pointer;
    transition:color .2s;
  }
  .soc:hover{color:#c8ff00}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:7px}
  .act{
    background:transparent;border:1px solid rgba(255,255,255,.15);
    padding:11px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    text-align:center;border-radius:3px;color:#fff;
    transition:background .2s;cursor:pointer;
  }
  .act:hover{background:rgba(255,255,255,.06)}
  .act.primary{background:#c8ff00;color:#0a0a0a;border-color:#c8ff00;font-weight:700}
  .act.primary:hover{background:#d4ff33}
</style>
</head>
<body>
  <div class="photo">
    <img src="../images/trainer-portrait.jpg" alt="Jamie Chen">
    <div class="lime-bar"></div>
  </div>
  <div class="body">
    <div class="name">Jamie Chen</div>
    <div class="role">Strength Coach</div>
    <div class="stats">
      <span><b>1:1</b>training</span>
      <span><b>200+</b>clients</span>
      <span><b>10y</b>experience</span>
    </div>
    <div class="socials">
      <span class="soc" title="Instagram"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg></span>
      <span class="soc" title="YouTube"><svg width="15" height="12" viewBox="0 0 576 512" fill="currentColor"><path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/></svg></span>
    </div>
    <div class="actions">
      <div class="act primary">Book a session</div>
      <div class="act">Save contact</div>
      <div class="act">Programs</div>
    </div>
  </div>
</body>
</html>
