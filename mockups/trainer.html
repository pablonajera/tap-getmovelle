<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamie Chen — Strength Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#1a1a1a;color:#fff;
    display:flex;flex-direction:column;
    position:relative;
  }
  .photo{
    height:48%;position:relative;overflow:hidden;
    background:#0e0e0e;z-index:1;
  }
  .photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05)}
  .lime-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#c8ff00}
  .body{flex:1;padding:24px 28px 28px;display:flex;flex-direction:column;text-align:center;position:relative;z-index:1}
  .name{font-size:22px;font-weight:700;letter-spacing:-0.01em}
  .role{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#c8ff00;margin-top:5px}
  .tagline{font-size:11px;color:rgba(255,255,255,.45);margin-top:12px;line-height:1.5}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .act{
    background:transparent;border:1px solid rgba(255,255,255,.15);
    padding:13px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    text-align:center;border-radius:3px;color:#fff;
    transition:background .2s;cursor:pointer;
  }
  .act:hover{background:rgba(255,255,255,.06)}
  .act.primary{background:#c8ff00;color:#0a0a0a;border-color:#c8ff00;font-weight:700}
  .act.primary:hover{background:#d4ff33}
</style>
</head>
<body>
  <div class="photo">
    <img src="../images/trainer-portrait.jpg" alt="Jamie Chen">
    <div class="lime-bar"></div>
  </div>
  <div class="body">
    <div class="name">Jamie Chen</div>
    <div class="role">Strength Coach</div>
    <div class="tagline">1-on-1 training · Miami Beach</div>
    <div class="actions">
      <div class="act primary">Book a session</div>
      <div class="act">Call</div>
      <div class="act">Text</div>
      <div class="act">Save contact</div>
    </div>
  </div>
</body>
</html>
