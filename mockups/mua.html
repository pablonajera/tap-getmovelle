<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofia Prieto — Makeup &amp; Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#1a1014;color:#f5e6e0;
    display:flex;flex-direction:column;
    position:relative;
  }
  body::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 30% 0%,rgba(199,120,140,.25) 0%,transparent 60%),
               radial-gradient(ellipse at 80% 100%,rgba(180,130,100,.15) 0%,transparent 50%);
    pointer-events:none;z-index:0;
  }
  .photo{
    height:48%;position:relative;overflow:hidden;
    background:#150d10;z-index:1;
  }
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
  .photo::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:100px;
    background:linear-gradient(transparent,#1a1014);
  }
  .body{flex:1;padding:14px 22px 20px;display:flex;flex-direction:column;text-align:center;position:relative;z-index:1}
  .name{font-family:'Sacramento',cursive;font-size:32px;font-weight:400;letter-spacing:.02em;color:#f5e6e0}
  .role{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#c7788c;margin-top:2px}
  .tagline{font-size:10px;color:rgba(245,230,224,.45);margin-top:8px;line-height:1.45}
  .socials{display:flex;justify-content:center;gap:14px;margin-top:12px}
  .soc{
    width:32px;height:32px;border-radius:50%;
    border:1px solid rgba(199,120,140,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#c7788c;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .soc:hover{background:rgba(199,120,140,.15);border-color:#c7788c}
  .actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .act{
    border:1px solid rgba(245,230,224,.12);
    padding:9px 6px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;
    border-radius:20px;text-align:center;background:transparent;color:#f5e6e0;
    transition:background .2s;cursor:pointer;
  }
  .act:hover{background:rgba(245,230,224,.06)}
  .act.primary{background:linear-gradient(135deg,#c7788c,#b86478);color:#1a1014;border:none;grid-column:span 2;font-weight:600}
  .act.primary:hover{background:linear-gradient(135deg,#d4889c,#c7788c)}
</style>
</head>
<body>
  <div class="photo">
    <img src="../images/mua-portrait.jpg" alt="Sofia Prieto">
  </div>
  <div class="body">
    <div class="name">Sofia Prieto</div>
    <div class="role">Makeup &amp; Beauty</div>
    <div class="tagline">Bridal, editorial &amp; everyday glam in Miami</div>
    <div class="socials">
      <div class="soc" title="Instagram"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg></div>
      <div class="soc" title="TikTok"><svg width="13" height="14" viewBox="0 0 448 512" fill="currentColor"><path d="M448 209.91a210.06 210.06 0 01-122.77-39.25v178.72A162.55 162.55 0 11185 188.31v89.89a74.62 74.62 0 1052.23 71.18V0h88a121.18 121.18 0 001.86 22.17A122.18 122.18 0 00381 102.39a121.43 121.43 0 0067 20.14z"/></svg></div>
      <div class="soc" title="YouTube"><svg width="15" height="12" viewBox="0 0 576 512" fill="currentColor"><path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/></svg></div>
    </div>
    <div class="actions">
      <div class="act primary">Book now</div>
      <div class="act">Call</div>
      <div class="act">Text</div>
      <div class="act">Portfolio</div>
      <div class="act">Save contact</div>
    </div>
  </div>
</body>
</html>
