<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movelle</title>
<script>
  (function () {
    var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    var dest = lang.indexOf('es') === 0 ? 'es/' : 'en/';
    // Detect base path: on elliot preview server the root is /tap-getmovelle/
    var base = window.location.pathname.replace(/index\.html$/, '');
    if (base.charAt(base.length - 1) !== '/') base += '/';
    window.location.replace(base + dest);
  })();
</script>
<style>
  body { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f6f3ee; color: #1a1815; }
  .pick { text-align: center; }
  .pick a { display: block; margin: 12px 0; font-size: 18px; color: #b8862d; text-decoration: none; letter-spacing: .1em; }
  .pick a:hover { text-decoration: underline; }
</style>
</head>
<body>
<noscript>
  <div class="pick">
    <p style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#6b655c;margin-bottom:24px;">MOVELLE</p>
    <a href="en/">English</a>
    <a href="es/">Español</a>
  </div>
</noscript>
</body>
</html>
